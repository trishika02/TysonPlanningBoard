<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="#4F46E5"/>

  <!-- Header row (column labels strip) -->
  <rect x="4" y="4" width="24" height="3.5" rx="1.75" fill="white" opacity="0.25"/>

  <!-- Sidebar strip (row labels) -->
  <rect x="4" y="10" width="3.5" height="3" rx="1.5" fill="white" opacity="0.4"/>
  <rect x="4" y="15.5" width="3.5" height="3" rx="1.5" fill="white" opacity="0.4"/>
  <rect x="4" y="21" width="3.5" height="3" rx="1.5" fill="white" opacity="0.4"/>

  <!-- Gantt bar row 1 (long) -->
  <rect x="10" y="10" width="14" height="3" rx="1.5" fill="white" opacity="0.95"/>

  <!-- Gantt bar row 2 (mid, offset right) -->
  <rect x="13" y="15.5" width="10" height="3" rx="1.5" fill="#A5B4FC"/>

  <!-- Gantt bar row 3 (shorter, starts earlier) -->
  <rect x="10" y="21" width="8" height="3" rx="1.5" fill="white" opacity="0.95"/>

  <!-- Today line -->
  <rect x="20" y="9" width="1.5" height="16" rx="0.75" fill="#FCD34D" opacity="0.9"/>
</svg>
